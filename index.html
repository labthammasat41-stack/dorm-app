<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>แอปหอพัก</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
/* ธีมเดียวกับแอปตาม Slide CBC: สว่างแบบห้องปฏิบัติการ พื้นขาว-ฟ้าอ่อน ตัวอักษรน้ำเงินเข้ม
   สีหลักเขียวน้ำทะเล ปุ่มเมนูไล่เฉด เขียว/ฟ้า/ม่วง/ส้ม ตัวหนังสือขยายได้ 3 ระดับ (ผู้ใช้สูงอายุอ่านง่าย) */
:root{
  color-scheme:light;
  --bg:#eef3f7; --surface:#ffffff; --sunk:#f7fafc; --ink:#102a43; --muted:#52677d; --line:#d6e1ea;
  --teal:#0b7a75; --teal-soft:#e1f3f1; --blue:#1f5fae; --blue-soft:#e7eff9; --violet:#5a45a8; --violet-soft:#efecfa;
  --acc:var(--teal); --on-acc:#ffffff;
  --ok:#1a7f4b; --ok-bg:#e3f4ea; --warn:#a85300; --warn-bg:#fff3df; --bad:#b42318; --bad-bg:#fdeceb; --info:#1f5fae; --info-bg:#e7eff9; --mute-bg:#eceff2;
  --m1:#009688; --m2:#1f5fae; --m3:#5a45a8; --m4:#c07a12;
  --shadow:0 1px 2px rgba(16,42,67,.06),0 4px 14px rgba(16,42,67,.06);
  --f-head:"Bai Jamjuree","IBM Plex Sans Thai",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Thai",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
html{font-size:calc(16px * var(--fs,1.12))}

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font-family:var(--f-body);font-size:1rem;line-height:1.6}
h1,h2,h3{font-family:var(--f-head);margin:0;line-height:1.25;text-wrap:balance}
h2{font-size:1.3rem}h3{font-size:1.05rem}
button,input,textarea,select{font:inherit;color:inherit}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}.small{font-size:.86rem}

.top{background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:980px;margin:0 auto;display:flex;align-items:center;gap:12px;justify-content:space-between;
  padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:12px;min-width:0;background:none;border:0;padding:0;cursor:pointer;text-align:left}
.mark{width:40px;height:40px;border-radius:11px;background:var(--acc);color:var(--on-acc);display:grid;place-items:center;flex:none}
.mark svg{width:22px;height:22px}
.brand b{display:block;font-family:var(--f-head);font-size:1.12rem;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand .sub{display:block;font-size:.8rem;color:var(--muted)}
.brand>div{min-width:0}
.who{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--sunk);border-radius:999px;padding:4px 12px 4px 4px;cursor:pointer;flex:none}
.av{width:32px;height:32px;border-radius:50%;background:var(--acc);color:var(--on-acc);display:grid;place-items:center;font-family:var(--f-head);font-weight:700;font-size:.9rem}
.demo{background:var(--sunk);border-bottom:1px solid var(--line)}
.demo-in{max-width:980px;margin:0 auto;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;font-size:.86rem;
  padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.demo-tag{font-weight:600;color:var(--warn);background:var(--warn-bg);border-radius:6px;padding:1px 8px}
.seg{display:inline-flex;flex-wrap:wrap;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{border:0;background:none;border-radius:7px;padding:4px 10px;cursor:pointer;color:var(--muted);font-size:.86rem}
.seg button[aria-pressed="true"]{background:var(--acc);color:var(--on-acc)}

main{max-width:980px;margin:0 auto;padding-block:20px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.stack{display:flex;flex-direction:column;gap:16px}
.narrow{max-width:560px;margin:0 auto;width:100%}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow);min-width:0}
.hello{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.hello h2{font-size:1.5rem}
.date{font-size:.9rem;color:var(--muted)}

.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.tile{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px;cursor:pointer;text-align:left;box-shadow:var(--shadow);transition:transform .12s,border-color .2s}
.tile:hover{border-color:var(--acc)}
.tile:active{transform:scale(.98)}
.tile-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.ic{width:44px;height:44px;border-radius:12px;background:color-mix(in srgb,var(--acc) 14%,transparent);color:var(--acc);display:grid;place-items:center;flex:none}
.ic svg{width:24px;height:24px}
.count{text-align:right;line-height:1.1}
.count b{display:block;font-family:var(--f-head);font-size:1.7rem;font-variant-numeric:tabular-nums}
.count span{font-size:.75rem;color:var(--muted)}
.tile h3{font-size:1.08rem}
.tile p{margin:0;font-size:.85rem;color:var(--muted)}
.flag{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:600;border-radius:999px;padding:2px 10px;align-self:flex-start}
.flag.bad{background:var(--bad-bg);color:var(--bad)}.flag.ok{background:var(--ok-bg);color:var(--ok)}

.panel.news{flex-direction:row;gap:14px;align-items:flex-start}
.news .ic{background:color-mix(in srgb,var(--acc) 14%,transparent)}
.news-t{min-width:0;flex:1}
.news-t b{font-family:var(--f-head);font-size:1.05rem;display:block}
.news-t p{margin:2px 0 0;font-size:.9rem;color:var(--muted);white-space:pre-line}

.page-head{display:flex;flex-direction:column;gap:10px}
.back{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 16px 7px 10px;font-weight:600;cursor:pointer}
.back svg{width:20px;height:20px}
.title-row{display:flex;align-items:center;gap:12px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{border:0;border-radius:11px;padding:12px 16px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:filter .15s,transform .1s}
.btn:active{transform:scale(.98)}
.btn svg{width:20px;height:20px}
.btn-acc{background:var(--acc);color:var(--on-acc)}
.btn-acc:hover{filter:brightness(1.07)}
.btn-line{background:var(--surface);border:1.5px solid var(--line);color:var(--ink)}
.btn-line:hover{border-color:var(--acc)}
.btn-ok{background:var(--ok);color:var(--surface)}.btn-bad{background:var(--bad-bg);color:var(--bad)}
.btn-sm{padding:7px 12px;font-size:.88rem;border-radius:9px}
.btn-block{width:100%;padding:14px}
.btn:disabled{opacity:.6;cursor:wait}
.big-act{min-height:76px;font-size:1.02rem;border-radius:14px}

.form{display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.field .lab{font-weight:600;font-size:.94rem}
.opt{font-weight:400;color:var(--muted);font-size:.84rem}
.input{width:100%;min-width:0;padding:11px 13px;border:1.5px solid var(--line);border-radius:10px;background:var(--sunk);font-size:1rem}
textarea.input{min-height:84px;resize:vertical}
.input:focus{outline:none;border-color:var(--acc);background:var(--surface);box-shadow:0 0 0 4px color-mix(in srgb,var(--acc) 15%,transparent)}
.scanrow{display:flex;gap:8px}.scanrow .input{flex:1}
.cam{flex:none;width:52px;border:0;border-radius:10px;background:var(--acc);color:var(--on-acc);cursor:pointer;display:grid;place-items:center}
.cam svg{width:24px;height:24px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;cursor:pointer;font-size:.9rem}
.chip[aria-pressed="true"]{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 12%,transparent);color:var(--acc);font-weight:600}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.toolbar .input{max-width:260px}

.list{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:13px 2px;border-top:1px solid var(--line);align-items:start}
.item:first-child{border-top:0}
.item.click{cursor:pointer;border-radius:10px;padding-inline:8px;margin-inline:-6px}
.item.click:hover{background:var(--sunk)}
.item-main{min-width:0}
.item-main b{font-weight:600}
.item-sub{font-size:.84rem;color:var(--muted);overflow-wrap:anywhere}
.item-act{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.tagno{font-family:var(--f-mono);font-size:.8rem;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:.78rem;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.t-open{background:var(--warn-bg);color:var(--warn)}.t-doing{background:var(--info-bg);color:var(--info)}
.t-done{background:var(--ok-bg);color:var(--ok)}.t-issue{background:var(--bad-bg);color:var(--bad)}.t-rejected{background:var(--mute-bg);color:var(--muted)}
.late{color:var(--bad);font-weight:600}
.empty{text-align:center;color:var(--muted);padding:22px 8px;font-size:.92rem}
.alert{padding:11px 14px;border-radius:10px;font-size:.92rem;white-space:pre-line}
.alert.bad{background:var(--bad-bg);color:var(--bad)}.alert.warn{background:var(--warn-bg);color:var(--warn)}.alert.info{background:var(--info-bg);color:var(--info)}.alert.ok{background:var(--ok-bg);color:var(--ok)}

.ticket-no{border:2.5px dashed var(--acc);border-radius:14px;padding:16px;text-align:center}
.ticket-no b{display:block;font-family:var(--f-mono);font-size:2rem;letter-spacing:.06em;color:var(--acc)}
.done{align-items:center;text-align:center}
.tick{width:60px;height:60px;border-radius:50%;background:var(--ok-bg);color:var(--ok);display:grid;place-items:center}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0;font-size:.94rem;text-align:left}
.kv dt{color:var(--muted)}.kv dd{margin:0;overflow-wrap:anywhere}

.chk{display:flex;flex-direction:column;gap:8px}
.chk-row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px}
.chk-row.ok{border-color:var(--ok);background:var(--ok-bg)}.chk-row.no{border-color:var(--bad);background:var(--bad-bg)}
.yn{display:flex;gap:6px}
.yn button{border:1.5px solid var(--line);background:var(--surface);border-radius:9px;padding:6px 12px;cursor:pointer;font-weight:600;font-size:.88rem}
.yn button.y[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.yn button.n[aria-pressed="true"]{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.lists{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.listcard{border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.listcard:hover{border-color:var(--acc)}
.listcard b{font-family:var(--f-head);font-size:1.02rem}

.photo-take{display:flex;align-items:center;justify-content:center;gap:10px;border:2px dashed var(--line);border-radius:12px;padding:14px;background:var(--sunk);color:var(--acc);font-weight:600;cursor:pointer}
.photo-take svg{width:22px;height:22px}
.photo-prev{display:flex;gap:12px;align-items:center}
.photo-prev img{width:84px;height:84px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}

.tabs{display:flex;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;align-self:flex-start}
.tabs button{border:0;background:none;border-radius:9px;padding:8px 16px;font-weight:600;cursor:pointer;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--surface)}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow)}
.kpi-h{display:flex;align-items:center;gap:8px;font-weight:600;font-family:var(--f-head)}
.sw{width:11px;height:11px;border-radius:3px;flex:none}
.kpi-n{display:flex;gap:16px;flex-wrap:wrap}
.kpi-n div{display:flex;flex-direction:column;line-height:1.2}
.kpi-n b{font-family:var(--f-head);font-size:1.5rem;font-variant-numeric:tabular-nums}
.kpi-n span{font-size:.75rem;color:var(--muted)}
.kpi-n .bad b{color:var(--bad)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:.82rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.plot svg{display:block;width:100%}
.plot text{font-family:var(--f-body);font-size:11.5px;fill:var(--muted)}
.plot .val{fill:var(--ink);font-weight:600}
.urow{display:grid;grid-template-columns:1fr auto;gap:6px 12px;padding:12px 0;border-top:1px solid var(--line);align-items:center}
.urow:first-child{border-top:0}

/* บิลค่าเช่า */
.bill{width:100%;border-collapse:collapse;font-size:.94rem}
.bill td{padding:8px 0;border-top:1px solid var(--line);vertical-align:top}
.bill td:last-child{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap;padding-left:12px}
.bill .calc{display:block;font-size:.8rem;color:var(--muted)}
.bill tr.sum td{border-top:2px solid var(--ink);font-weight:700;font-size:1.05rem}
.mrow{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px;padding:12px 0;border-top:1px solid var(--line)}
.mrow:first-child{border-top:0}
.mh{grid-column:1/-1;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.mh b{font-family:var(--f-head)}
.mtot{font-family:var(--f-mono);font-weight:600;white-space:nowrap}
.mtot.bad{color:var(--bad);font-family:var(--f-body);font-size:.84rem}
.mrow .field label{font-size:.82rem;font-weight:500;color:var(--muted)}
.mrow.billed{grid-template-columns:1fr;color:var(--muted)}
.meter{height:8px;border-radius:999px;background:var(--sunk);overflow:hidden;border:1px solid var(--line)}
.meter i{display:block;height:100%;background:var(--acc)}
/* ประกาศใหญ่หน้าแรก */
.newsbig{padding:0;overflow:hidden;gap:0;cursor:pointer;text-align:left;border:1px solid #dde7ef;width:100%;font:inherit;color:inherit}
.newsbig img,.newsimg{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;background:var(--sunk)}
.newsbig .nb{padding:16px 18px;display:flex;flex-direction:column;gap:4px}
.newsbig .tag{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;background:var(--teal-soft);color:var(--teal);font-weight:600;font-size:.8rem;border-radius:999px;padding:2px 10px}
.newsbig .tag svg{width:16px;height:16px}
.newsbig h2{font-size:1.35rem}
.newsbig p{margin:0;color:var(--muted);white-space:pre-line}
.newsimg{border-radius:12px;margin-top:8px}
/* เลือกบทบาทในหน้าเข้าสู่ระบบ */
.roles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.role{border:2px solid var(--line);background:#fff;border-radius:14px;padding:12px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:600;color:var(--ink);transition:transform .1s,border-color .2s,background .2s}
.role svg{width:28px;height:28px;color:var(--muted)}
.role[aria-pressed="true"]{border-color:var(--teal);background:var(--teal-soft);color:var(--teal)}
.role[aria-pressed="true"] svg{color:var(--teal)}
.role:active{transform:scale(.97)}
.linkbtn{background:none;border:0;color:var(--blue);cursor:pointer;padding:4px 0;font-size:.92rem;text-decoration:underline;align-self:center}
.codebox{font-family:var(--f-mono);font-size:2.2rem;letter-spacing:.2em;text-align:center;border:2.5px dashed var(--teal);border-radius:14px;padding:12px;color:var(--teal)}
.urow{grid-template-columns:minmax(0,1fr)!important;gap:8px!important}
.urow>.chips{flex-wrap:wrap;gap:6px}
/* แชต */
.thread{display:flex;flex-direction:column;gap:8px;max-height:52vh;overflow:auto;padding:4px 2px;background:var(--sunk);border-radius:12px;padding:10px}
.bub{max-width:82%;padding:8px 12px;border-radius:14px 14px 14px 4px;background:#fff;border:1px solid var(--line);align-self:flex-start;white-space:pre-line;overflow-wrap:anywhere}
.bub.me{align-self:flex-end;background:var(--teal);color:#fff;border-color:var(--teal);border-radius:14px 14px 4px 14px}
.bub small{display:block;font-size:.72rem;opacity:.75;margin-top:2px}
.sendrow{display:flex;gap:8px}.sendrow .input{flex:1}
.badge{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:var(--bad);color:#fff;font-size:.75rem;font-weight:700}
/* รถ */
.carcard{border:2px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;background:#fff}
.carcard.ok{border-color:var(--ok)}.carcard.warn{border-color:var(--warn)}
.plate{font-family:var(--f-head);font-weight:700;font-size:1.2rem;letter-spacing:.02em}
.carrow{display:grid;grid-template-columns:1fr 1fr;gap:8px;border:1.5px dashed var(--line);border-radius:12px;padding:10px}
.carrow .full{grid-column:1/-1}
/* ตั้งค่า */
.permtbl{overflow-x:auto}
.permtbl table{border-collapse:collapse;width:100%;min-width:560px;font-size:.88rem}
.permtbl th,.permtbl td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:center}
.permtbl th:first-child,.permtbl td:first-child{text-align:left;white-space:nowrap}
.permtbl input{width:20px;height:20px;accent-color:var(--teal)}
.dutybox{border:1.5px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.mon-pos{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.mon-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow)}
.mon-card h3{display:flex;justify-content:space-between;gap:8px;align-items:center}
#rm-body{display:flex;flex-direction:column;gap:26px}
.sumrow{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:.88rem;color:var(--muted)}

.modal{position:fixed;inset:0;z-index:50;background:rgba(10,16,14,.55);display:flex;align-items:flex-end;justify-content:center;
  padding:calc(16px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
@media (min-width:640px){.modal{align-items:center}}
.modal-box{position:relative;background:var(--surface);border-radius:18px;width:100%;max-width:500px;max-height:100%;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:14px}
.modal-box>.pill{align-self:flex-start}
.modal-x{position:absolute;top:10px;right:10px;width:38px;height:38px;border-radius:50%;border:0;background:var(--sunk);cursor:pointer;font-size:1.2rem}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--surface);padding:11px 18px;border-radius:10px;font-size:.92rem;z-index:60;max-width:calc(100% - 32px)}
.loading{color:var(--muted);text-align:center;padding:40px 0}
.sk{background:var(--sunk);border-radius:12px;height:110px}

.scan-ov{position:fixed;inset:0;z-index:70;background:rgba(8,12,11,.93);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px;color:#fff}
#reader{width:min(100%,460px);border-radius:12px;overflow:hidden;background:#000}
.scan-ov .msg{max-width:420px;text-align:center;font-size:.92rem}
.scan-ov .row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.scan-ov .btn-line{background:transparent;color:#fff;border-color:rgba(255,255,255,.5)}

<script>
(function(){
/* ===== ตั้งค่า =====
 * หน้าเว็บเดียวใช้ได้ทุกร้าน: ลิงก์ของร้านคือ  ที่อยู่เว็บ/?s=รหัสร้าน
 * หน้าเว็บจะอ่าน shops.json (ไฟล์ข้างกัน) เพื่อหาลิงก์ /exec ของร้านนั้น
 *   { "baansuan": { "name": "หอพักบ้านสวนจันทร์", "api": "https://script.google.com/macros/s/xxxx/exec" } }
 * ไม่มี ?s= → เปิดโหมดตัวอย่าง (ข้อมูลสมมติ ใช้โชว์ลูกค้า)
 * ถ้าจะใช้กับร้านเดียวแบบไม่มี shops.json ใส่ลิงก์ /exec ที่ FIXED_API ได้
 */
const FIXED_API='https://script.google.com/macros/s/AKfycby2EOuvEnwhTGFd9RL5hY1LpM2B0t5UNk6GBghyDkxu8QXq3RtR3BDZtzFnJZAhdQE/exec';
const SHOP=(new URLSearchParams(location.search).get('s')||'').trim().toLowerCase();
let API_URL=FIXED_API, DEMO=!FIXED_API&&!SHOP;
const EXEC_RE=/^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/;
async function resolveShop(){
  if(FIXED_API){if(!EXEC_RE.test(FIXED_API))throw new Error('ลิงก์ใน FIXED_API ไม่ถูกต้อง ต้องขึ้นต้นด้วย https://script.google.com/macros/s/ และลงท้ายด้วย /exec\nคัดลอกจาก Apps Script > การทำให้ใช้งานได้ > จัดการการทำให้ใช้งานได้ > URL เว็บแอป (ไม่ใช่ลิงก์ script.googleusercontent.com ในแถบที่อยู่เว็บ)');return}
  if(!SHOP)return;
  if(!/^[a-z0-9-]{2,40}$/.test(SHOP))throw new Error('รหัสร้านในลิงก์ไม่ถูกต้อง ตรวจลิงก์ที่ได้รับอีกครั้ง');
  let list;
  try{const r=await fetch('shops.json',{cache:'no-store'});if(!r.ok)throw 0;list=await r.json()}
  catch(e){throw new Error('โหลดรายชื่อร้านไม่ได้ ตรวจอินเทอร์เน็ตแล้วลองใหม่')}
  const shop=list[SHOP];
  if(!shop||!EXEC_RE.test(shop.api||''))throw new Error('ไม่พบร้านรหัส "'+SHOP+'" ติดต่อผู้ติดตั้งระบบ');
  API_URL=shop.api;
}

function stLabel(m,r){
  const st=r.st;
  if(m.kind==='track')return st==='open'?m.openState:m.doneState;
  if(m.kind==='ticket'&&m.approve)return {open:'รออนุมัติ',done:'อนุมัติแล้ว',rejected:'ไม่อนุมัติ'}[st]||st;
  if(m.kind==='ticket')return {open:'รอดำเนินการ',doing:'กำลังดำเนินการ',done:'เสร็จแล้ว'}[st]||st;
  if(m.kind==='check')return st==='issue'?'มีจุดต้องแก้':r.note?'แก้ไขแล้ว':'ผ่านครบ';
  if(m.kind==='billing')return {open:'ค้างชำระ',doing:'รอตรวจสลิป',done:'ชำระแล้ว'}[st]||st;
  return '';
}

async function run(fn,...args){
  if(DEMO){await new Promise(r=>setTimeout(r,160));const f=Mock.api[fn];if(!f)throw new Error('โหมดตัวอย่างไม่มีคำสั่งนี้');return JSON.parse(JSON.stringify(f(...args)))}
  let res;
  try{res=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn,args}),redirect:'follow'})}
  catch(e){throw new Error('เชื่อมต่อไม่ได้ ตรวจอินเทอร์เน็ตแล้วลองใหม่')}
  let j;try{j=await res.json()}catch(e){throw new Error('ระบบตอบกลับผิดรูปแบบ ให้ผู้ดูแลตรวจการติดตั้ง Apps Script')}
  if(!j.ok){if(/เข้าสู่ระบบใหม่|กรุณาเข้าสู่ระบบ/.test(j.error)){clearTok();ME=null}throw new Error(j.error)}
  return j.data;
}

const sess={get(k){try{return sessionStorage.getItem(k)}catch(e){return null}},set(k,v){try{sessionStorage.setItem(k,v)}catch(e){}},del(k){try{sessionStorage.removeItem(k)}catch(e){}}};

const saveTok=(t,remember)=>{store.del(TOKEN);sess.del(TOKEN);(remember?store:sess).set(TOKEN,t)};
const clearTok=()=>{store.del(TOKEN);sess.del(TOKEN)};

function shrink(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file),img=new Image();
  img.onload=()=>{const k=Math.min(1,1280/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',.72))};
  img.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('อ่านรูปไม่ได้ ถ่ายใหม่อีกครั้ง'))};img.src=u})}

  m.innerHTML=`<div class="modal-box">${html}<button class="modal-x" aria-label="ปิด">✕</button></div>`;
  const close=()=>{m.remove();document.removeEventListener('keydown',k)};const k=e=>{if(e.key==='Escape')close()};
  m.addEventListener('click',e=>{if(e.target===m)close()});m.querySelector('.modal-x').onclick=close;document.addEventListener('keydown',k);
  document.body.appendChild(m);const f=m.querySelector('input,textarea');(f||m.querySelector('.modal-x')).focus();return {el:m,close}}

/* ===== แจ้งเตือนในแอป: หน้าแรกเปิดค้างไว้ ระบบเช็กงานใหม่ทุก 60 วินาที มีงานเพิ่ม = เสียงติ๊ง + ตัวเลขบนแท็บ ===== */
let lastTotal=null,actx=null;
const totalOf=h=>Object.values(h.counts).reduce((s,c)=>s+c.open,0);
function beep(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();
  [0,.18].forEach((t,i)=>{const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=i?1046:784;o.connect(g);g.connect(actx.destination);
    g.gain.setValueAtTime(.0001,actx.currentTime+t);g.gain.exponentialRampToValueAtTime(.25,actx.currentTime+t+.02);g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+t+.16);
    o.start(actx.currentTime+t);o.stop(actx.currentTime+t+.17)})}catch(e){}}
function badge(n){document.title=(n?`(${n}) `:'')+(BIZ?BIZ.org:'แอปหอพัก')}
setInterval(async()=>{if(!ME||view.name!=='home'||document.hidden||document.querySelector('.modal'))return;
  try{const h=await run('apiHome',tok());const t=totalOf(h);
    if(lastTotal!=null&&t>lastTotal){beep();if(navigator.vibrate)navigator.vibrate([80,60,80]);toast('มีงานใหม่ '+(t-lastTotal)+' รายการ');vHome()}
    lastTotal=t;badge(t)}catch(e){}},60000);

      <div class="nb"><span class="tag">${icon('megaphone')}ประกาศล่าสุด · ${esc(n.at)}</span><h2>${esc(n.owner)}</h2>${n.detail?`<p>${esc(n.detail)}</p>`:''}
      ${h.news.length>1?`<span class="small" style="color:var(--blue);font-weight:600">ดูประกาศทั้งหมด (${h.news.length}+)</span>`:''}</div></button>`:'';
    const nb=$('#nb');if(nb)nb.onclick=()=>{const nm=BIZ.modules.find(x=>x.kind==='news');if(nm)go('mod',{id:nm.id})};
    const tiles=BIZ.modules.map(m=>{const c=h.counts[m.id]||{open:0,overdue:0,today:0};
      const big=m.kind==='news'||m.kind==='vehicle'?'':m.kind==='chat'?`<div class="count"><b>${c.open}</b><span>ข้อความใหม่</span></div>`:m.kind==='check'?`<div class="count"><b>${c.today}</b><span>ครั้งวันนี้</span></div>`:`<div class="count"><b>${c.open}</b><span>${m.kind==='track'?esc(m.openState):m.kind==='billing'?'ค้างชำระ':m.approve?'รออนุมัติ':'ยังไม่เสร็จ'}</span></div>`;
      const fl=c.overdue?`<span class="flag bad">เกินกำหนด ${c.overdue}</span>`:m.kind==='check'&&c.open?`<span class="flag bad">จุดต้องแก้ ${c.open}</span>`:'';
      return `<button class="tile t${BIZ.modules.indexOf(m)%4}" data-m="${m.id}"><div class="tile-top"><span class="ic">${icon(m.icon)}</span>${big}</div><div><h3>${esc(m.label)}</h3><p>${esc(m.desc)}</p></div>${fl}</button>`}).join('');
    $('#tiles').innerHTML=tiles+(isAdmin()?`<button class="tile tadm" data-admin><div class="tile-top"><span class="ic">${icon('chart')}</span></div><div><h3>ผู้จัดการ</h3><p>ติดตามงาน ผู้ใช้ ตั้งค่าสิทธิ์</p></div></button>`:'');
    app.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>go('mod',{id:b.dataset.m}));
    const a=app.querySelector('[data-admin]');if(a)a.onclick=()=>go('admin',{tab:'stats'});
    $('#mine').innerHTML=h.mine.length?h.mine.map(r=>{const m=modOf(r.mod);return m?`<div class="item click" data-open="${esc(r.id)}"><div class="item-main"><b>${m.kind==='billing'?'ห้อง ':''}${esc(r.owner)}</b>
      <div class="item-sub">${esc(m.label)} · <span class="tagno">${esc(r.id)}</span> · ${esc(r.at)}</div></div>${pill(m,r)}</div>`:''}).join(''):'<div class="empty">ยังไม่มีงาน เริ่มจากเลือกเมนูด้านบน</div>';
    app.querySelectorAll('[data-open]').forEach(el=>el.onclick=()=>{const r=h.mine.find(x=>x.id===el.dataset.open);detail(modOf(r.mod),r,()=>vHome())});
  }).catch(err=>{$('#tiles').innerHTML=errBox(err.message)});
}

/* ===== รายละเอียดรายการ (ป๊อปอัป) ===== */
function detail(m,r,after){
  if(m.kind==='billing')return billDetail(m,r,after);
  const rows=[['เลขรายการ',`<span class="mono">${esc(r.id)}</span>`]];
  if(r.code)rows.push([m.codeLabel||'บาร์โค้ด',`<span class="mono">${esc(r.code)}</span>`]);
  if(m.kind==='ticket'||(m.cats&&r.cat))rows.push([m.kind==='ticket'?'หมวด':'มาทำอะไร',esc(r.cat)]);
  rows.push([m.ownerLabel||m.whereLabel||'เรื่อง',esc(r.owner)]);
  if(r.detail)rows.push([m.detailLabel||'รายละเอียด',esc(r.detail)]);
  rows.push([m.atLabel||'บันทึกโดย',`${esc(r.by)}<br><span class="small muted">${esc(r.at)}${r.st==='open'?' · '+ago(r.atTs)+'ที่แล้ว':''}</span>`]);
  if(r.photo)rows.push(['รูปหลักฐาน',r.photo.startsWith('http')?`<a href="${esc(r.photo)}" target="_blank" rel="noopener">เปิดดูรูป</a>`:'มีรูปแนบ (ผู้ดูแลเปิดดูได้)']);
  if(r.closeBy)rows.push([r.st==='doing'?'ผู้รับงาน':m.closeAtLabel||'ปิดงานโดย',`${esc(r.closeBy)}${r.closeAt?`<br><span class="small muted">${esc(r.closeAt)}</span>`:''}`]);
  if(r.extra&&r.extra.park)rows.push(['ค่าจอด',`${r.extra.park.fee?baht(r.extra.park.fee)+' บาท':'ไม่มี'}<br><span class="small muted">จอด ${dur(r.extra.park.mins)} · ฟรี ${r.extra.park.freeMin} นาที · ชม.ละ ${baht(r.extra.park.perHour)}</span>`]);
  if(r.note)rows.push([m.kind==='track'?m.closeWhoLabel:'หมายเหตุ',esc(r.note)]);
  const checks=m.kind==='check'&&r.extra&&r.extra.items?`<div class="chk">${r.extra.items.map(i=>`<div class="chk-row ${i.ok?'ok':'no'}"><span>${esc(i.t)}</span><b>${i.ok?'ผ่าน':'ไม่ผ่าน'}</b></div>`).join('')}</div>`:'';
  const mm=modal(`<div style="padding-right:40px"><div class="small muted">${esc(m.label)}</div><h2>${esc(r.owner)}</h2></div>${pill(m,r)}
    ${r.overdue?`<div class="alert bad">เกินกำหนดแล้ว (เกิน ${m.overdueHrs>=48?Math.round(m.overdueHrs/24)+' วัน':m.overdueHrs+' ชั่วโมง'})</div>`:''}
    <dl class="kv">${rows.map(x=>`<dt>${x[0]}</dt><dd>${x[1]}</dd>`).join('')}</dl>${checks}<div id="d-act" class="form"></div>`);
  const box=mm.el.querySelector('#d-act');
  const done=()=>{mm.close();after&&after()};
  if(m.kind==='track'&&r.st==='open')closeForm(box,m,r,done);
  else if(m.kind==='ticket')ticketActs(box,m,r,done);
  else if(m.kind==='check'&&r.st==='issue'&&isAdmin())fixForm(box,r,done);
}
const parkFee=(p,mins)=>mins>p.freeMin?Math.ceil((mins-p.freeMin)/60)*p.perHour:0;
function closeForm(box,m,r,done){
  const pk=m.parking&&r.code?m.parking:null,mins=pk?Math.max(0,Math.round((Date.now()-r.atTs)/60000)):0;
  box.innerHTML=`<h3>${esc(m.closeVerb)}</h3>
    ${pk?`<div class="alert ${parkFee(pk,mins)?'warn':'ok'}">จอด ${dur(mins)} · ฟรี ${pk.freeMin} นาที\n${parkFee(pk,mins)?'ค่าจอดประมาณ '+baht(parkFee(pk,mins))+' บาท (คิดจริงตอนกดยืนยัน)':'ยังไม่เกินเวลาจอดฟรี'}</div>`:''}
    <div class="field"><label for="c-who">${esc(m.closeWhoLabel)}${m.closeOptional?' <span class="opt">(ถ้ามี)</span>':''}</label><input class="input" id="c-who" autocomplete="off"></div>
    ${m.closeOptional?'':`<div class="field"><label for="c-note">หมายเหตุ <span class="opt">(ถ้ามี)</span></label><input class="input" id="c-note" autocomplete="off"></div>`}
    <div id="c-err"></div><button class="btn btn-acc btn-block" id="c-ok">${icon('check')}ยืนยัน${esc(m.closeVerb)}</button>`;
  box.querySelector('#c-ok').onclick=async e=>{const b=e.currentTarget;busy(b,true);
    try{const x=await run('apiClose',tok(),r.id,{who:box.querySelector('#c-who').value.trim(),note:(box.querySelector('#c-note')||{value:''}).value.trim()});
      const f=x.extra&&x.extra.park&&x.extra.park.fee;toast(m.closeVerb+' แล้ว'+(f?' · เก็บค่าจอด '+baht(f)+' บาท':''));done()}
    catch(err){box.querySelector('#c-err').innerHTML=errBox(err.message);busy(b,false)}};
}
function ticketActs(box,m,r,done){
  let btns='';
  if(m.approve){if(r.st==='open'&&isAdmin())btns=`<button class="btn btn-ok" data-st="done">อนุมัติ</button><button class="btn btn-bad" data-st="rejected">ไม่อนุมัติ</button>`;
    else if(r.st==='open')box.innerHTML='<div class="alert info">รอผู้ดูแลพิจารณา</div>'}
  else if(r.st==='open')btns=`<button class="btn btn-line" data-st="doing">รับงาน</button><button class="btn btn-ok" data-st="done">ปิดงาน (เสร็จแล้ว)</button>`;
  else if(r.st==='doing')btns=`<button class="btn btn-ok" data-st="done">ปิดงาน (เสร็จแล้ว)</button>`;
  if(!btns)return;
  box.innerHTML=`<div class="field"><label for="t-note">หมายเหตุ <span class="opt">(เช่น สิ่งที่ทำ เหตุผล)</span></label><input class="input" id="t-note" autocomplete="off"></div>
    <div id="t-err"></div><div class="actions">${btns}</div>`;
  box.querySelectorAll('[data-st]').forEach(b=>b.onclick=async()=>{busy(b,true);
    try{await run('apiSetStatus',tok(),r.id,b.dataset.st,box.querySelector('#t-note').value.trim());toast('อัปเดตสถานะแล้ว');done()}
    catch(err){box.querySelector('#t-err').innerHTML=errBox(err.message);busy(b,false)}});
}
function fixForm(box,r,done){
  box.innerHTML=`<div class="field"><label for="f-note">แก้ไขอะไรไปแล้ว</label><input class="input" id="f-note" autocomplete="off"></div>
    <div id="f-err"></div><button class="btn btn-ok btn-block" id="f-ok">ปิดจุดต้องแก้</button>`;
  box.querySelector('#f-ok').onclick=async e=>{const b=e.currentTarget;busy(b,true);
    try{await run('apiSetStatus',tok(),r.id,'done',box.querySelector('#f-note').value.trim());toast('ปิดจุดต้องแก้แล้ว');done()}
    catch(err){box.querySelector('#f-err').innerHTML=errBox(err.message);busy(b,false)}};
}

/* ===== หน้าเมนู ===== */
function vMod(){
  const m=modOf(view.id);if(!m)return go('home');
  ({track:vTrack,ticket:vTicket,check:vCheck,news:vNews,billing:vBilling,vehicle:vVehicle,chat:vChat})[m.kind](m);
  bindBack();
}
/* รายการพร้อมตัวกรอง */
function listBlock(m,opts){
  const state=view.state||'active';
  return `<section class="panel"><div class="toolbar"><div class="chips" role="group" aria-label="ตัวกรอง">
      <button class="chip" data-f="active" aria-pressed="${state==='active'}">${esc(opts.activeLabel)}</button>
      <button class="chip" data-f="closed" aria-pressed="${state==='closed'}">${esc(opts.closedLabel)}</button></div>
    <input class="input" id="q" placeholder="ค้นหา" value="${esc(view.q||'')}" aria-label="ค้นหาในรายการ"></div>
    <div class="list" id="list">${loadingList}</div></section>`;
}
function loadList(m){
  const box=$('#list');
  app.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{view.state=b.dataset.f;vMod()});
  let t;const q=$('#q');q.oninput=()=>{clearTimeout(t);t=setTimeout(()=>{view.q=q.value;fill()},300)};
  const fill=()=>run('apiList',tok(),m.id,{state:view.state||'active',q:view.q||''}).then(rows=>{
    box.innerHTML=rows.length?rows.map(r=>`<div class="item click" data-r="${esc(r.id)}"><div class="item-main">
        <b>${m.kind==='billing'?'ห้อง ':''}${esc(r.owner)}</b><div class="item-sub">${r.cat&&m.kind!=='check'?esc(r.cat)+' · ':''}${esc(r.detail)}</div>
        <div class="item-sub"><span class="tagno">${esc(r.id)}</span>${r.code?` · ${m.kind==='billing'?'รอบ '+esc(monthTH(r.code)):`<span class="mono">${esc(r.code)}</span>`}`:''} · ${esc(r.at)}${ACTIVE.includes(r.st)&&m.kind!=='check'?` · <span class="${r.overdue?'late':''}">${r.overdue?'เกินกำหนด ':''}${ago(r.atTs)}</span>`:''}</div></div>
        ${pill(m,r)}</div>`).join(''):`<div class="empty">${(view.state||'active')==='active'?'ไม่มีรายการค้าง':'ยังไม่มีรายการที่ปิดแล้ว'}</div>`;
    box.querySelectorAll('[data-r]').forEach(el=>el.onclick=()=>detail(m,rows.find(x=>x.id===el.dataset.r),fill));
  }).catch(err=>{box.innerHTML=errBox(err.message)});
  fill();
}

/* track: รับเข้า → ส่งมอบ */
function vTrack(m){
  app.innerHTML=`<div class="stack">${backHead(m.label,m.desc,m.icon)}
    <div class="actions"><button class="btn btn-acc big-act" id="go-new">${icon('inbox')}${esc(m.openVerb)}</button>
      <button class="btn btn-line big-act" id="go-close">${icon('outbox')}${esc(m.closeVerb)}</button></div>
    ${listBlock(m,{activeLabel:m.openState,closedLabel:m.doneState})}</div>`;
  $('#go-new').onclick=()=>trackNew(m);$('#go-close').onclick=()=>trackFind(m);
  loadList(m);
}
function trackNew(m,pre){
  let photo='';pre=pre||{};
  const mm=modal(`<h2>${esc(m.openVerb)}</h2><form class="form" id="nf" novalidate>
    ${m.cats?`<div class="field"><span class="lab">มาทำอะไร</span><div class="chips">${m.cats.map(c=>`<button type="button" class="chip" data-c="${esc(c)}" aria-pressed="false">${esc(c)}</button>`).join('')}</div></div>`:''}
    <div class="field"><label for="n-owner">${esc(m.ownerLabel)}</label><input class="input" id="n-owner" autocomplete="off"></div>
    ${m.codeMode==='scan'?scanField('n-code',esc(m.codeLabel)+' <span class="opt">(ถ้ามี)</span>'):m.codeMode==='text'?`<div class="field"><label for="n-code">${esc(m.codeLabel)} <span class="opt">(ถ้ามี เช่น กข 1234 กรุงเทพ)</span></label><input class="input mono" id="n-code" autocomplete="off"></div>`:'<div class="alert info">ระบบจะออกเลขป้ายให้หลังบันทึก ให้เขียนเลขนี้ติดที่ของ</div>'}
    <div class="field"><label for="n-detail">${esc(m.detailLabel)} <span class="opt">(ถ้ามี)</span></label><input class="input" id="n-detail" autocomplete="off"></div>
    ${photoField('n-photo')}<div id="n-err"></div><button class="btn btn-acc btn-block" type="submit">บันทึก</button></form>`);
  mm.el.querySelectorAll('[data-scan]').forEach(b=>b.onclick=()=>openScanner(document.getElementById(b.dataset.scan)));
  bindPhoto('n-photo',d=>photo=d);
  let cat='';mm.el.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{cat=b.dataset.c;mm.el.querySelectorAll('[data-c]').forEach(x=>x.setAttribute('aria-pressed',x===b))});
  const v=id=>{const e=mm.el.querySelector('#'+id);return e?e.value.trim():''};
  if(pre.code&&mm.el.querySelector('#n-code'))mm.el.querySelector('#n-code').value=pre.code;
  if(m.parking){const p=m.parking;mm.el.querySelector('#nf').insertAdjacentHTML('afterbegin',`<div class="alert info small">จอดฟรี ${p.freeMin} นาที เกินคิดชั่วโมงละ ${baht(p.perHour)} บาท (เศษชั่วโมงคิดเต็ม) ระบบคำนวณให้ตอนบันทึกออก</div>`)}
  mm.el.querySelector('#nf').onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector('button[type=submit]');busy(b,true);
    try{const r=await run('apiCreate',tok(),m.id,{code:v('n-code'),owner:v('n-owner'),detail:v('n-detail'),cat,photo});
      if(r.dup){mm.el.querySelector('#n-err').innerHTML=`<div class="alert warn">${esc(m.codeLabel||'บาร์โค้ด')}นี้บันทึกไว้แล้วและยัง${esc(m.openState)}\n${esc(r.dup.owner)} · ${esc(r.dup.at)} · โดย ${esc(r.dup.by)}</div>`;busy(b,false);return}
      mm.close();showDone(m,r.rec,m.openVerb)}
    catch(err){mm.el.querySelector('#n-err').innerHTML=errBox(err.message);busy(b,false)}};
}
function trackFind(m){
  const mm=modal(`<h2>${esc(m.closeVerb)}</h2><form class="form" id="ff" novalidate>
    ${scanField('f-q','ค้นหา',m.codeMode==='tag'?'เลขป้าย หรือ '+m.ownerLabel:'บาร์โค้ด หรือ '+m.ownerLabel)}
    <button class="btn btn-acc" type="submit">${icon('search')}ค้นหา</button></form><div id="f-res" class="list"></div>`);
  mm.el.querySelectorAll('[data-scan]').forEach(b=>b.onclick=()=>openScanner(document.getElementById(b.dataset.scan)));
  mm.el.querySelector('#ff').onsubmit=async e=>{e.preventDefault();const box=mm.el.querySelector('#f-res');box.innerHTML='<div class="muted small">กำลังค้นหา…</div>';
    try{const rows=await run('apiFind',tok(),m.id,mm.el.querySelector('#f-q').value);
      box.innerHTML=rows.length?rows.map(r=>`<div class="item click" data-r="${esc(r.id)}"><div class="item-main"><b>${esc(r.owner)}</b>
        <div class="item-sub">${esc(r.detail)}</div><div class="item-sub"><span class="tagno">${esc(r.id)}</span> · ${esc(r.at)}${r.overdue?' · <span class="late">เกินกำหนด</span>':''}</div></div>${pill(m,r)}</div>`).join('')
        :`<div class="alert warn">ไม่พบรายการที่ยัง${esc(m.openState)} ลองค้นด้วยคำอื่น</div>`;
      box.querySelectorAll('[data-r]').forEach(el=>el.onclick=()=>{mm.close();detail(m,rows.find(x=>x.id===el.dataset.r),()=>vMod())})}
    catch(err){box.innerHTML=errBox(err.message)}};
}
function showDone(m,r,verb){
  const mm=modal(`<div class="done stack" style="align-items:center;text-align:center"><div class="tick">${icon('check')}</div><h2>${esc(verb)}แล้ว</h2>
    ${m.kind==='track'&&m.codeMode==='tag'?`<div class="ticket-no" style="width:100%"><span class="small muted">เลขป้าย เขียนติดที่ของ</span><b>${esc(r.id)}</b></div>`:`<div class="mono muted">${esc(r.id)}</div>`}
    <dl class="kv"><dt>${esc(m.ownerLabel||m.whereLabel||'เรื่อง')}</dt><dd>${esc(r.owner)}</dd>${r.detail?`<dt>รายละเอียด</dt><dd>${esc(r.detail)}</dd>`:''}<dt>เวลา</dt><dd>${esc(r.at)}</dd></dl>
    <button class="btn btn-acc btn-block" data-ok>เรียบร้อย</button></div>`);
  mm.el.querySelector('[data-ok]').onclick=()=>{mm.close();vMod()};
}

/* ticket: แจ้งเรื่อง */
function vTicket(m){
  app.innerHTML=`<div class="stack">${backHead(m.label,m.desc,m.icon)}
    <button class="btn btn-acc big-act" id="go-new">${icon('plus')}${m.approve?'ยื่นคำขอใหม่':'แจ้งเรื่องใหม่'}</button>
    ${m.approve&&!isAdmin()?'<div class="alert info">คุณเห็นเฉพาะคำขอของตัวเอง</div>':''}
    ${listBlock(m,{activeLabel:m.approve?'รออนุมัติ':'ยังไม่เสร็จ',closedLabel:'ปิดแล้ว'})}</div>`;
  $('#go-new').onclick=()=>{
    let photo='',cat='';
    const mm=modal(`<h2>${m.approve?'ยื่นคำขอ':'แจ้งเรื่อง'}</h2><form class="form" id="tf" novalidate>
      <div class="field"><span class="lab">หมวด</span><div class="chips" id="cats">${m.cats.map(c=>`<button type="button" class="chip" data-c="${esc(c)}" aria-pressed="false">${esc(c)}</button>`).join('')}</div></div>
      <div class="field"><label for="t-where">${esc(m.whereLabel)}</label><input class="input" id="t-where" autocomplete="off"></div>
      <div class="field"><label for="t-detail">รายละเอียด</label><textarea class="input" id="t-detail"></textarea></div>
      ${photoField('t-photo')}<div id="t-err"></div><button class="btn btn-acc btn-block" type="submit">${m.approve?'ส่งคำขอ':'ส่งเรื่อง'}</button></form>`);
    mm.el.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{cat=b.dataset.c;mm.el.querySelectorAll('[data-c]').forEach(x=>x.setAttribute('aria-pressed',x===b))});
    bindPhoto('t-photo',d=>photo=d);
    mm.el.querySelector('#tf').onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector('button[type=submit]');busy(b,true);
      try{const r=await run('apiCreate',tok(),m.id,{cat,owner:mm.el.querySelector('#t-where').value.trim(),detail:mm.el.querySelector('#t-detail').value.trim(),photo});
        mm.close();showDone(m,r.rec,m.approve?'ส่งคำขอ':'แจ้งเรื่อง')}
      catch(err){mm.el.querySelector('#t-err').innerHTML=errBox(err.message);busy(b,false)}};
  };
  loadList(m);
}

/* check: เช็กลิสต์ */
function vCheck(m){
  app.innerHTML=`<div class="stack">${backHead(m.label,m.desc,m.icon)}
    <section class="panel"><h3>เริ่มตรวจ</h3><div class="lists">${m.lists.map((l,i)=>`<button class="listcard" data-l="${i}"><b>${esc(l.name)}</b><span class="small muted">${l.items.length} ข้อ</span></button>`).join('')}</div></section>
    ${listBlock(m,{activeLabel:'มีจุดต้องแก้',closedLabel:'ประวัติการตรวจ'})}</div>`;

    catch(e){const box=mm.el.querySelector('#b-act');box.insertAdjacentHTML('afterbegin',`<div class="field"><label for="b-txt">กดค้างเพื่อคัดลอก</label><textarea class="input" id="b-txt" readonly>${esc(t)}</textarea></div>`);mm.el.querySelector('#b-txt').select()}};

function meterForm(m,after){
  const mm=modal(`<h2>จดมิเตอร์ / ออกบิล</h2><div class="field"><label for="mt-month">รอบบิล</label><input class="input" type="month" id="mt-month" value="${monthNow()}"></div><div id="mt-body">${loadingList}</div>`);
  const body=mm.el.querySelector('#mt-body'),mon=mm.el.querySelector('#mt-month');
  const load=()=>run('apiRooms',tok(),mon.value).then(d=>{
    const on=d.rooms.filter(r=>r.on),todo=on.filter(r=>!d.billed.includes(r.room)),billed=on.filter(r=>d.billed.includes(r.room));
    if(!on.length){body.innerHTML=`<div class="empty">ยังไม่มีห้องที่มีผู้เช่า${isAdmin()?' เพิ่มห้องที่ "ห้องพักและอัตรา" ก่อน':' ให้เจ้าของเพิ่มห้องก่อน'}</div>`;return}
    body.innerHTML=`<div class="sumrow"><span>น้ำหน่วยละ ${baht(d.rates.water)}${d.rates.waterMin?` (ขั้นต่ำ ${baht(d.rates.waterMin)})`:''}</span><span>ไฟหน่วยละ ${baht(d.rates.elec)}</span><span>ใส่เลขบนหน้าปัดมิเตอร์ ระบบลบเลขเดิมให้</span></div>
      <div>${todo.map((r,i)=>`<div class="mrow" data-i="${i}"><div class="mh"><div><b>ห้อง ${esc(r.room)}</b> <span class="small muted">${esc(r.tenant)} · ค่าเช่า ${baht(r.rent)}</span></div><span class="mtot" id="mt-t${i}">–</span></div>
        <div class="field"><label for="mt-w${i}">น้ำ (เดิม ${baht(r.w)})</label><input class="input mono" id="mt-w${i}" inputmode="decimal" autocomplete="off"></div>
        <div class="field"><label for="mt-e${i}">ไฟ (เดิม ${baht(r.e)})</label><input class="input mono" id="mt-e${i}" inputmode="decimal" autocomplete="off"></div></div>`).join('')}
      ${billed.map(r=>`<div class="mrow billed"><div class="mh"><span>ห้อง ${esc(r.room)} · ${esc(r.tenant)}</span><span class="small">ออกบิลรอบนี้แล้ว</span></div></div>`).join('')}</div>
      ${todo.length?`<div id="mt-err"></div><button class="btn btn-acc btn-block" id="mt-ok" disabled>ใส่เลขมิเตอร์ก่อน</button>`:'<div class="alert ok">ออกบิลรอบนี้ครบทุกห้องแล้ว</div>'}`;
    if(!todo.length)return;
    const ok=body.querySelector('#mt-ok');
    const read=()=>todo.map((r,i)=>({r,i,w:body.querySelector('#mt-w'+i).value.trim(),e:body.querySelector('#mt-e'+i).value.trim()}));
    const paint=()=>{let n=0,sum=0,bad=0;read().forEach(q=>{const t=body.querySelector('#mt-t'+q.i);
      if(q.w===''&&q.e===''){t.className='mtot';t.textContent='–';return}
      if(q.w===''||q.e===''){t.className='mtot bad';t.textContent='ใส่ให้ครบทั้งน้ำและไฟ';bad++;return}
      const w=+q.w,e=+q.e;if(isNaN(w)||isNaN(e)){t.className='mtot bad';t.textContent='ใส่เป็นตัวเลข';bad++;return}
      if(w<q.r.w||e<q.r.e){t.className='mtot bad';t.textContent=w<q.r.w?'น้ำน้อยกว่าเลขเดิม':'ไฟน้อยกว่าเลขเดิม';bad++;return}
      const b=calcBill(d.rates,q.r.rent,q.r.w,w,q.r.e,e);t.className='mtot';t.textContent=baht(b.total)+' บาท';n++;sum+=b.total});
      ok.disabled=!n||bad>0;ok.textContent=bad?'แก้ช่องสีแดงก่อน':n?`ออกบิล ${n} ห้อง · รวม ${baht(sum)} บาท`:'ใส่เลขมิเตอร์ก่อน'};
    body.querySelectorAll('input').forEach(x=>x.addEventListener('input',paint));
    ok.onclick=async()=>{busy(ok,true,'กำลังออกบิล…');
      try{const rd=read().filter(q=>q.w!==''&&q.e!=='').map(q=>({room:q.r.room,w:+q.w,e:+q.e}));
        const res=await run('apiBill',tok(),{month:mon.value,readings:rd});mm.close();toast(`ออกบิล ${res.count} ห้องแล้ว รวม ${baht(res.total)} บาท`);after&&after()}
      catch(e){body.querySelector('#mt-err').innerHTML=errBox(e.message);busy(ok,false)}};
  }).catch(e=>{body.innerHTML=errBox(e.message)});
  mon.onchange=()=>{body.innerHTML=loadingList;load()};
  load();
}

/* chat: กล่องแชต ใช้ทั้งฝั่งผู้เช่าและเจ้าหน้าที่ */
function chatBox(title,load,send){
  const mm=modal(`<h2>${esc(title)}</h2><div class="thread" id="th"><div class="muted small">กำลังโหลด…</div></div>
    <form class="sendrow" id="sf"><input class="input" id="st" maxlength="1000" autocomplete="off" placeholder="พิมพ์ข้อความ"><button class="btn btn-acc" type="submit">ส่ง</button></form><div id="se"></div>`);
  const th=mm.el.querySelector('#th');
  const paint=rows=>{th.innerHTML=rows.length?rows.map(x=>`<div class="bub ${x.mine?'me':''}">${esc(x.text)}<small>${esc(x.name)} · ${esc(x.at)}</small></div>`).join(''):'<div class="muted small">ยังไม่มีข้อความ เริ่มพิมพ์ได้เลย</div>';th.scrollTop=th.scrollHeight};
  const tick=()=>load().then(paint).catch(e=>{mm.el.querySelector('#se').innerHTML=errBox(e.message)});
  tick();const iv=setInterval(()=>{if(!document.body.contains(mm.el))return clearInterval(iv);if(!document.hidden)tick()},10000);
  mm.el.querySelector('#sf').onsubmit=async e=>{e.preventDefault();const i=mm.el.querySelector('#st'),t=i.value.trim();if(!t)return;const b=e.target.querySelector('button');busy(b,true,'…');
    try{paint(await send(t));i.value='';mm.el.querySelector('#se').innerHTML=''}catch(x){mm.el.querySelector('#se').innerHTML=errBox(x.message)}busy(b,false);i.focus()};
  return mm;
}

function niceMax(v){if(v<=4)return 4;const p=Math.pow(10,Math.floor(Math.log10(v)));for(const k of [1,2,2.5,5,10])if(k*p>=v)return k*p;return 10*p}
function drawBars(el,s){
  const W=Math.max(280,el.clientWidth),H=220,L=30,R=8,T=14,B=26,pw=W-L-R,ph=H-T-B;
  const tot=d=>s.modules.reduce((a,m)=>a+(d.n[m.id]||0),0);
  const max=niceMax(Math.max(1,...s.daily.map(tot)));
  const step=pw/s.daily.length,bw=Math.max(3,Math.min(30,step*.62));
  const every=s.daily.length<=7?1:s.daily.length<=30?5:15;
  let g='';
  [0,.5,1].forEach(f=>{const y=T+ph-ph*f;g+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${L-6}" y="${y+4}" text-anchor="end">${Math.round(max*f)}</text>`});
  s.daily.forEach((d,i)=>{const x=L+i*step+(step-bw)/2;let y=T+ph;
    s.modules.forEach((m,j)=>{const v=d.n[m.id]||0;if(!v)return;const h=ph*v/max;y-=h;g+=`<rect x="${x}" y="${y}" width="${bw}" height="${Math.max(1,h-1)}" rx="2" fill="${MCOL[j%4]}"><title>${esc(m.label)} ${v}</title></rect>`});
    if(i%every===0||i===s.daily.length-1){const [yy,mm,dd]=d.d.split('-');g+=`<text x="${x+bw/2}" y="${H-8}" text-anchor="middle">${+dd}/${+mm}</text>`}});
  el.innerHTML=`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="จำนวนรายการใหม่ต่อวัน แยกตามเมนู">${g}</svg>`;
}
function paneUsers(){
  run('apiUsers',tok()).then(us=>{
    const reqs=us.filter(u=>u.resetAt),pend=us.filter(u=>u.state==='รออนุมัติ');
    const staff=us.filter(u=>u.state!=='รออนุมัติ'&&u.role!=='tenant'),ten=us.filter(u=>u.state!=='รออนุมัติ'&&u.role==='tenant');
    const sub=u=>`<span class="mono">${esc(u.id)}</span> · ${ROLE_TH[u.role]}${u.posLabel?' · '+esc(u.posLabel):''}${u.room?' ห้อง '+esc(u.room):''} · ${esc(u.phone||'')} · สมัคร ${esc(u.regAt)}`;
    const flag=u=>u.role==='tenant'&&u.state==='รออนุมัติ'?(u.roomOk===false?'<div class="item-sub late">ห้องนี้เป็นห้องว่าง/ไม่มีในระบบ</div>'
      :u.phoneMatch?'':'<div class="item-sub" style="color:var(--warn)">เบอร์ไม่ตรงกับที่บันทึกไว้ในห้อง ตรวจกับผู้เช่าก่อนอนุมัติ</div>'):'';
    const btn=(u,a,l,c)=>`<button class="btn ${c} btn-sm" data-u="${esc(u.id)}" ${a}>${l}</button>`;
    const row=u=>`<div class="urow"><div class="item-main"><b>${esc(u.first)} ${esc(u.last)}</b><div class="item-sub">${sub(u)}</div>${flag(u)}</div>
      <div class="chips">${u.id===ME.id?'<span class="small muted">บัญชีของคุณ</span>':u.state==='รออนุมัติ'?btn(u,'data-s="active"','อนุมัติ','btn-ok')+btn(u,'data-s="off"','ปฏิเสธ','btn-bad')
        :u.state==='ระงับ'?'<span class="pill t-rejected">ระงับ</span>'+btn(u,'data-s="active"','เปิดใช้','btn-line')
        :(u.role==='staff'?`<select class="input" style="width:auto;padding:6px 10px" data-pos="${esc(u.id)}" aria-label="ตำแหน่ง">${Object.entries(DEMO_CFG.POS).map(([k,v])=>`<option value="${k}" ${u.pos===k?'selected':''}>${esc(v)}</option>`).join('')}</select>`:'')+
         (u.role!=='tenant'?btn(u,`data-r="${u.role==='admin'?'staff':'admin'}"`,u.role==='admin'?'ลดเป็นพนักงาน':'ตั้งเป็นผู้จัดการ','btn-line'):'')+btn(u,'data-x="1"','ออกรหัสชั่วคราว','btn-line')+btn(u,'data-s="off"','ระงับ','btn-bad')}</div></div>`;
    const reqRow=u=>`<div class="urow"><div class="item-main"><b>${esc(u.first)} ${esc(u.last)}</b><div class="item-sub">${sub(u)}</div>
      <div class="item-sub" style="color:var(--warn)">ขอรีเซ็ตรหัสเมื่อ ${esc(u.resetAt)} · โทรยืนยันกับเบอร์นี้ก่อนออกรหัส</div></div><div class="chips">${btn(u,'data-x="1"','ออกรหัสชั่วคราว','btn-acc')}</div></div>`;
    const sec=(t,a,f)=>a.length?`<section class="panel"><h3>${t} (${a.length})</h3><div>${a.map(f).join('')}</div></section>`:'';
    $('#pane').innerHTML=sec('ขอรีเซ็ตรหัสผ่าน',reqs,reqRow)+sec('รออนุมัติ',pend,row)+sec('ผู้จัดการและพนักงาน',staff,row)+sec('ผู้เช่า',ten,row)||'<div class="empty">ยังไม่มีผู้ใช้</div>';
    app.querySelectorAll('select[data-pos]').forEach(sel=>sel.onchange=async()=>{try{await run('apiSetUser',tok(),sel.dataset.pos,{pos:sel.value});toast('เปลี่ยนตำแหน่งแล้ว');paneUsers()}catch(e){toast(e.message)}});
    app.querySelectorAll('[data-u]').forEach(b=>b.onclick=async()=>{
      if(b.dataset.x){busy(b,true,'…');
        try{const r=await run('apiResetUser',tok(),b.dataset.u);
          modal(`<h2>รหัสชั่วคราวของ ${esc(r.id)}</h2><div class="codebox">${esc(r.code)}</div>
            <div class="alert info">บอกรหัสนี้กับเจ้าของบัญชีทางโทรศัพท์หรือ LINE เท่านั้น เมื่อเข้าระบบด้วยรหัสนี้ ระบบจะให้ตั้งรหัสใหม่ทันที รหัสนี้แสดงครั้งเดียว</div>`);paneUsers()}
        catch(err){toast(err.message);busy(b,false)}return}
      busy(b,true,'…');
      try{await run('apiSetUser',tok(),b.dataset.u,b.dataset.s?{state:b.dataset.s}:{role:b.dataset.r});toast('บันทึกแล้ว');paneUsers()}
      catch(err){toast(err.message);busy(b,false)}});
  }).catch(err=>{$('#pane').innerHTML=errBox(err.message)});
}
/* ===== ผู้จัดการ: ติดตามงาน ===== */
function paneMonitor(){
  run('apiMonitor',tok()).then(d=>{
    $('#pane').innerHTML=`<div class="toolbar"><h3>งานวันนี้ตามตำแหน่ง</h3><span class="small muted">อัปเดต ${esc(d.updated)} · <button class="linkbtn" id="mon-r">รีเฟรช</button></span></div>
      <div class="mon-pos">${d.pos.map(p=>{const need=p.lists.length,done=p.lists.filter(l=>l.done.length).length,issue=p.lists.some(l=>l.done.some(x=>x.st==='issue'));
        return `<div class="mon-card"><h3>${esc(p.label)}<span class="pill ${!need?'t-rejected':issue?'t-issue':done===need?'t-done':'t-open'}">${need?`ทำแล้ว ${done}/${need}`:'ไม่มีเช็กลิสต์'}</span></h3>
        <div class="small muted">${p.staff.length?p.staff.map(s=>`${esc(s.name)} · ใช้งานล่าสุด ${s.last?esc(s.last):'ยังไม่เคย'}`).join('<br>'):'ยังไม่มีพนักงานตำแหน่งนี้'}</div>
        ${p.lists.map(l=>`<div class="item" style="padding:8px 0"><div class="item-main"><b>${esc(l.name.split(' · ')[1]||l.name)}</b>
          <div class="item-sub">${l.done.length?l.done.map(x=>`${esc(x.at.slice(-5))} ${esc(x.by)} · ${esc(x.detail)}`).join('<br>'):'<span class="late">วันนี้ยังไม่ได้ทำ</span>'}</div></div>
          ${l.done.length?`<span class="pill t-${l.done.some(x=>x.st==='issue')?'issue':'done'}">${l.done.some(x=>x.st==='issue')?'มีจุดต้องแก้':'ผ่าน'}</span>`:''}</div>`).join('')}</div>`}).join('')}</div>
      <section class="panel"><h3>ความเคลื่อนไหวล่าสุด</h3><div class="list">${d.feed.slice(0,15).map(e=>`<div class="item"><div class="item-main"><b>${esc(e.who||'-')}</b> <span class="muted">${esc(e.act)} · ${esc(e.mod)}</span>
        <div class="item-sub">${esc(e.owner)} · <span class="tagno">${esc(e.id)}</span> · ${esc(e.at)}</div></div></div>`).join('')||'<div class="empty">ยังไม่มีความเคลื่อนไหว</div>'}</div></section>`;
    $('#mon-r').onclick=paneMonitor;
  }).catch(err=>{$('#pane').innerHTML=errBox(err.message)});
}
/* ===== ผู้จัดการ: ตั้งค่าสิทธิ์ ค่าจอด งานพื้นฐาน ===== */
function paneSettings(){
  run('apiSettings',tok()).then(st=>{
    const P=st.POS,F=st.FEAT,pk=st.parking;let du=JSON.parse(JSON.stringify(st.duties));
    $('#pane').innerHTML=`<section class="panel"><h3>สิทธิ์ของแต่ละตำแหน่ง</h3><div class="small muted">ผู้จัดการเข้าได้ทุกเมนูเสมอ · ทุกตำแหน่งเห็นประกาศและงานประจำตำแหน่งของตัวเอง</div>
        <div class="permtbl"><table><thead><tr><th>ตำแหน่ง</th>${Object.keys(F).map(f=>`<th title="${esc(F[f])}">${esc(({bill:'บิล',parcel:'พัสดุ',repair:'แจ้งซ่อม',visitor:'ผู้มาติดต่อ',vehicle:'รถลูกบ้าน',chat:'แชต',newsPost:'โพสต์ประกาศ'})[f]||F[f])}</th>`).join('')}</tr></thead><tbody>
        ${Object.keys(P).map(k=>`<tr><td><b>${esc(P[k])}</b></td>${Object.keys(F).map(f=>`<td><input type="checkbox" data-p="${k}" data-f="${f}" ${st.perms[k].includes(f)?'checked':''} aria-label="${esc(P[k]+' '+F[f])}"></td>`).join('')}</tr>`).join('')}</tbody></table></div>
        <div id="pe"></div><button class="btn btn-acc" id="ps">บันทึกสิทธิ์</button></section>
      <section class="panel"><h3>ค่าจอดรถผู้มาติดต่อ</h3><div class="row2">
        <div class="field"><label for="pk-f">จอดฟรี (นาที)</label><input class="input mono" id="pk-f" inputmode="numeric" value="${pk.freeMin}"></div>
        <div class="field"><label for="pk-h">เกินแล้ว ชั่วโมงละ (บาท)</label><input class="input mono" id="pk-h" inputmode="decimal" value="${pk.perHour}"></div></div>
        <div class="small muted">เศษชั่วโมงคิดเต็มชั่วโมง เช่น ฟรี 60 นาที อยู่ 2 ชม. 10 นาที = เกิน 1 ชม. 10 นาที คิด 2 ชม.</div>
        <div id="pke"></div><button class="btn btn-acc" id="pks">บันทึกค่าจอด</button></section>
      <section class="panel"><h3>ข้อความแจ้งการเก็บข้อมูลส่วนบุคคล (PDPA)</h3>
        <div class="small muted">ผู้สมัครต้องกดยินยอมข้อความนี้ · {ORG} = ชื่อหอพัก · {DAYS} = จำนวนวันที่ลบข้อมูลหลังย้ายออก · ควรให้ผู้รู้กฎหมายตรวจก่อนใช้จริง</div>
        <textarea class="input" id="pv-t" rows="10">${esc(st.privacy||'')}</textarea>
        <div id="pve"></div><div class="actions"><button class="btn btn-acc" id="pvs">บันทึกข้อความ</button><button class="btn btn-line" data-privacy>ดูตัวอย่าง</button></div></section>
      <section class="panel"><h3>งานพื้นฐานของแต่ละตำแหน่ง</h3><div class="small muted">แต่ละตำแหน่งมีเช็กลิสต์ได้ 10 ชุด ชุดละ 1–20 ข้อ · ใส่ 1 ข้อต่อ 1 บรรทัด</div>
        <div class="chips" id="dp">${Object.keys(P).map((k,i)=>`<button type="button" class="chip" data-dp="${k}" aria-pressed="${i===0}">${esc(P[k])}</button>`).join('')}</div>
        <div id="dl" class="stack"></div><button class="btn btn-line" id="da">${icon('plus')}เพิ่มเช็กลิสต์</button>
        <div id="de"></div><button class="btn btn-acc" id="ds">บันทึกงานพื้นฐาน</button></section>`;
    let cur=Object.keys(P)[0];
    const read=()=>{du[cur]=[...$('#dl').querySelectorAll('.dutybox')].map(b=>({name:b.querySelector('[data-n]').value,items:b.querySelector('textarea').value.split('\n')}))};
    const draw=()=>{$('#dl').innerHTML=(du[cur]||[]).map((l,i)=>`<div class="dutybox"><div class="scanrow"><input class="input" data-n value="${esc(l.name)}" placeholder="ชื่อเช็กลิสต์" aria-label="ชื่อเช็กลิสต์">
      <button type="button" class="btn btn-bad btn-sm" data-dd="${i}" aria-label="ลบเช็กลิสต์">${icon('trash')}</button></div>
      <textarea class="input" rows="4" aria-label="รายการตรวจ">${esc(l.items.join('\n'))}</textarea></div>`).join('')||'<div class="empty">ยังไม่มีเช็กลิสต์</div>';
      $('#dl').querySelectorAll('[data-dd]').forEach(b=>b.onclick=()=>{read();du[cur].splice(+b.dataset.dd,1);draw()})};
    draw();
    app.querySelectorAll('[data-dp]').forEach(b=>b.onclick=()=>{read();cur=b.dataset.dp;app.querySelectorAll('[data-dp]').forEach(x=>x.setAttribute('aria-pressed',x===b));draw()});
    $('#da').onclick=()=>{read();(du[cur]=du[cur]||[]).push({name:'',items:[]});draw()};
    const save=(btn,box,body,msg)=>async()=>{busy(btn,true);try{await run('apiSaveSettings',tok(),body());toast(msg);box.innerHTML='';await boot2()}catch(e){box.innerHTML=errBox(e.message)}busy(btn,false)};
    $('#ps').onclick=save($('#ps'),$('#pe'),()=>{const o={};Object.keys(P).forEach(k=>o[k]=[...app.querySelectorAll(`[data-p="${k}"]:checked`)].map(x=>x.dataset.f));return {perms:o}},'บันทึกสิทธิ์แล้ว มีผลตอนพนักงานเปิดแอปครั้งถัดไป');
    $('#pks').onclick=save($('#pks'),$('#pke'),()=>({parking:{freeMin:$('#pk-f').value,perHour:$('#pk-h').value}}),'บันทึกค่าจอดแล้ว');
    $('#ds').onclick=save($('#ds'),$('#de'),()=>{read();return {duties:du}},'บันทึกงานพื้นฐานแล้ว');
    app.querySelectorAll('#pane [data-privacy]').forEach(b=>b.onclick=showPrivacy);
    $('#pvs').onclick=async e=>{const b=e.currentTarget;busy(b,true);try{await run('apiSavePrivacy',tok(),$('#pv-t').value);toast('บันทึกข้อความแล้ว');$('#pve').innerHTML=''}catch(x){$('#pve').innerHTML=errBox(x.message)}busy(b,false)};
  }).catch(err=>{$('#pane').innerHTML=errBox(err.message)});
}
/* โหลดเมนูของผู้ใช้ใหม่โดยไม่ออกจากหน้าตั้งค่า */
async function boot2(){try{const d=await run('apiInit',tok());BIZ=d.biz;if(d.me)ME=d.me}catch(e){}}

let rsT;window.addEventListener('resize',()=>{clearTimeout(rsT);rsT=setTimeout(()=>{if(view.name==='admin'&&(view.tab||'stats')==='stats'&&$('#plot'))paneStats()},250)});

/* ===== เริ่มแอป ===== */
async function boot(){
  document.querySelectorAll('.modal').forEach(m=>m.remove());
  try{await resolveShop();
    const d=await run('apiInit',tok());BIZ=d.biz;
    if(d.me){await afterLogin(d.me);return}
    ME=null;view={name:'login'};render()}
  catch(err){app.innerHTML=`<div class="narrow">${errBox('โหลดไม่สำเร็จ: '+err.message)}</div>`}
}
boot();
})();
